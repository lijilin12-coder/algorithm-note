  known_limits:
    - text: 本轮修复只在 Linux/WSL 沙盒环境中实测；macOS 分支（lsof 判断端口监听状态）逻辑上与 Linux 分支对称、同样不做 PID
        归属过滤，但未在真实 macOS 硬件上跑过。
      truncated: false
    - text: 启动前的端口占用前置检查与随后启动 debugpy 之间存在极窄的 TOCTOU
        窗口（理论上另一进程可能恰好在此期间抢占该端口），视为可接受的残余风险，与任何前置检查类设计一致，未做额外加固。
      truncated: false
  known_limits_truncated: false
  review:
    status: passed
    summary:
      text: 对 scripts/debugpy_listen.sh 运行了一次独立只读代码审查（/code-review
        medium）。审查发现两个问题并已修复：(1) 最初版本的修复用进程树遍历做 PID 归属校验，但实测发现 debugpy 的 adapter
        子进程会与本脚本脱离父子关系（daemonize/reparent），进程树校验完全失效（要么永远探测不到真正的监听
        socket，要么误判端口上残留的孤儿进程为就绪）——已改为“启动前确认端口未被占用”的前置校验思路，从根本上避免了 PID 归属问题；(2)
        信号 trap 缺少显式 exit，导致取消/终止时脚本会继续执行到轮询循环、最终误报为启动失败——已改为在 INT/TERM 分支中调用
        cleanup 后显式 exit 对应信号退出码。修复后针对两点分别补充了测试并通过。
      truncated: false
    reviewer_execution_ref: "code-review skill run (effort: medium, scope:
      scripts/debugpy_listen.sh), forked execution"
