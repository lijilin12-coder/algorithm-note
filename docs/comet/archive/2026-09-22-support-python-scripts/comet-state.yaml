  iteration: 2
  summary:
    text: "修复 A5：scripts/debugpy_listen.sh 的端口就绪探测改为只读取内核监听状态表（Linux:
      /proc/net/tcp[6]，macOS: lsof），不再对端口发起任何真实 TCP 连接，避免该探测本身被 debugpy
      误判为客户端已连接并断开、导致 adapter 在 VS Code
      真正连接前退出。启动前新增端口占用前置检查（端口已被占用时立即报错，不静默复用/误判为就绪），使轮询期间一旦观测到监听状态就必然对应本次启动（同一\
      端口不会同时有两个监听者），从而绕开 debugpy adapter 子进程会脱离父进程树、无法用 PID 归属校验的问题。另外修复了信号处理
      trap 缺少显式 exit
      的问题：取消/终止调试会话时脚本现在会立即以对应信号退出码退出，而不是继续走到轮询循环并最终误报“未能进入监听状态”的启动失败错误。"
    truncated: false
